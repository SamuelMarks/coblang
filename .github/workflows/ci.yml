name: CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Formatting, Clippy, Rustdoc, Doc-Argument & Clean-Room Lints
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (fmt, clippy, rustdoc, clean-room)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install LLVM 20 & MLIR 20 development libraries
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          CODENAME="$(. /etc/os-release && echo "${UBUNTU_CODENAME}")"
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-20-dev libmlir-20-dev mlir-20-tools libpolly-20-dev zlib1g-dev libzstd-dev
          echo "MLIR_SYS_200_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"
          echo "LLVM_SYS_201_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"
          echo "TABLEGEN_200_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy, Rustdoc, 5-way Doc Coverage & Clean-Room Lints
        run: ./scripts/precommit-lint.sh

      - name: Verify README.md '% doc coverage' shield
        run: python3 scripts/update-readme-shields.py --metric doc --readme README.md --check

  # ---------------------------------------------------------------------------
  # 2. Cross-Platform Workspace Tests & Ported Conformance Suite Ratchet
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install host oracle, LLVM 20, MLIR 20 & C companion dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          CODENAME="$(. /etc/os-release && echo "${UBUNTU_CODENAME}")"
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gnucobol llvm-20-dev libmlir-20-dev mlir-20-tools libpolly-20-dev zlib1g-dev libzstd-dev
          echo "MLIR_SYS_200_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"
          echo "LLVM_SYS_201_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"
          echo "TABLEGEN_200_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"

      - name: Install host oracle & LLVM 20 dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install gnucobol llvm@20
          LLVM20_PREFIX="$(brew --prefix llvm@20)"
          echo "MLIR_SYS_200_PREFIX=${LLVM20_PREFIX}" >> "$GITHUB_ENV"
          echo "LLVM_SYS_201_PREFIX=${LLVM20_PREFIX}" >> "$GITHUB_ENV"
          echo "TABLEGEN_200_PREFIX=${LLVM20_PREFIX}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache verified upstream COBOL test archives
        uses: actions/cache@v6
        with:
          path: .upstream-cache
          key: upstream-tests-v1-${{ hashFiles('scripts/fetch-upstream-tests.sh') }}

      - name: Fetch & cryptographically verify upstream test suites
        run: ./scripts/fetch-upstream-tests.sh

      - name: Run workspace unit & integration tests
        run: cargo test --workspace --all-targets --locked

      - name: Run full ported test suite with expectation ratchet
        run: cargo run --locked -p coblang-test-runner --bin coblang-test -- run --bundle-dir tests --baseline tests/expectations/baseline.toml --ratchet -j 8

  # ---------------------------------------------------------------------------
  # 3. Full 7-Gate Quality Script & 100% Function/Line/Branch Coverage Gate
  # ---------------------------------------------------------------------------
  coverage:
    name: Quality Gate & 100% Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install host oracle, LLVM 20, MLIR 20 & C companion dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          CODENAME="$(. /etc/os-release && echo "${UBUNTU_CODENAME}")"
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gnucobol llvm-20-dev libmlir-20-dev mlir-20-tools libpolly-20-dev zlib1g-dev libzstd-dev
          echo "MLIR_SYS_200_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"
          echo "LLVM_SYS_201_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"
          echo "TABLEGEN_200_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Rust nightly toolchain (for branch coverage)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache verified upstream COBOL test archives
        uses: actions/cache@v6
        with:
          path: .upstream-cache
          key: upstream-tests-v1-${{ hashFiles('scripts/fetch-upstream-tests.sh') }}

      - name: Fetch & cryptographically verify upstream test suites
        run: ./scripts/fetch-upstream-tests.sh

      - name: Execute full 7-step quality & 100% coverage gate
        run: ./scripts/check-quality.sh

      - name: Verify README.md '% test coverage' shield
        run: python3 scripts/update-readme-shields.py --metric test --readme README.md --check

  # ---------------------------------------------------------------------------
  # 4. Build Release Binaries (runs on v* tags after lint, test & coverage pass)
  # ---------------------------------------------------------------------------
  build-release:
    name: Build Release (${{ matrix.target }})
    needs:
      - lint
      - test
      - coverage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install LLVM 20 & MLIR 20 development libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
          CODENAME="$(lsb_release -cs)"
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm-20-dev libmlir-20-dev mlir-20-tools libpolly-20-dev zlib1g-dev libzstd-dev
          echo "MLIR_SYS_200_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"
          echo "LLVM_SYS_201_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"
          echo "TABLEGEN_200_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"

      - name: Install LLVM 20 & MLIR 20 development libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20
          LLVM_PREFIX="$(brew --prefix llvm@20)"
          BREW_LIB="$(brew --prefix)/lib"
          echo "MLIR_SYS_200_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "LLVM_SYS_201_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "TABLEGEN_200_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${BREW_LIB}" >> "$GITHUB_ENV"

      - name: Install Rust stable toolchain for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build workspace binaries (--release --locked)
        run: cargo build --workspace --bins --release --locked --target "${{ matrix.target }}"

      - name: Package release archive & SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          PKG_NAME="coblang-${TAG}-${TARGET}"
          STAGE_DIR="dist/${PKG_NAME}"

          mkdir -p "${STAGE_DIR}/bin"
          for bin in coblang cobc-shim cobcrun-shim gcobol-shim coblang-test; do
            cp "target/${TARGET}/release/${bin}" "${STAGE_DIR}/bin/"
            chmod 0755 "${STAGE_DIR}/bin/${bin}"
          done

          for doc in LICENSE LICENSE-APACHE README.md tests/LICENSE_MANIFEST.md; do
            if [[ -f "${doc}" ]]; then
              cp "${doc}" "${STAGE_DIR}/"
            fi
          done

          tar -C dist -czf "dist/${PKG_NAME}.tar.gz" "${PKG_NAME}"
          (
            cd dist
            shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          )

      - name: Upload release artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 5. Publish GitHub Release (runs on v* tags after all targets build cleanly)
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs:
      - build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all target release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        run: |
          cd release-assets
          shasum -a 256 *.tar.gz | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: coblang ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.tar.gz.sha256
            release-assets/SHA256SUMS.txt
