[package]
name = "coblang-rt-abi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Clean-room C-ABI runtime surface (`libcoblang_rt`) for compiled COBOL executables and modules."

[lib]
name = "coblang_rt"
crate-type = ["rlib", "staticlib", "cdylib"]
test = false

[dependencies]
coblang-common.workspace = true
coblang-decimal.workspace = true
coblang-dynload.workspace = true
coblang-fileio.workspace = true
coblang-hir.workspace = true
coblang-intrinsics.workspace = true
coblang-isam.workspace = true
coblang-pic.workspace = true
coblang-report.workspace = true
coblang-rt-core.workspace = true
coblang-screen.workspace = true
coblang-sort.workspace = true
coblang-xml-json.workspace = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "forbid"
unused_qualifications = "deny"
unreachable_pub = "deny"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
private_intra_doc_links = "forbid"
missing_crate_level_docs = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "forbid"
expect_used = "forbid"
panic = "deny"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
fn_params_excessive_bools = "deny"
indexing_slicing = "deny"
fallible_impl_from = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
