[package]
name = "coblang-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Audited LLVM 20 TargetMachine codegen (`.ll`, `.s`, `.o`) and system linker driver."

[dependencies]
coblang-common.workspace = true
coblang-mlir.workspace = true
llvm-sys.workspace = true
mlir-sys.workspace = true

[dev-dependencies]
coblang-diag.workspace = true
coblang-pp.workspace = true
coblang-rt-abi.workspace = true
coblang-sema.workspace = true
coblang-syntax.workspace = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "forbid"
unused_qualifications = "deny"
unreachable_pub = "deny"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
private_intra_doc_links = "forbid"
missing_crate_level_docs = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "forbid"
expect_used = "forbid"
panic = "deny"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
fn_params_excessive_bools = "deny"
indexing_slicing = "deny"
fallible_impl_from = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
